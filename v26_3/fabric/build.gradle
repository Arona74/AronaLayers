plugins {
	// 26.x ships deobfuscated: the non-remapping Loom plugin, and no mappings dependency.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = rootProject.mod_version + "+mc${minecraft_version}"
group = rootProject.maven_group

base {
	archivesName = rootProject.archives_base_name + '-fabric'
}

// Sources, most specific first:
// - src/                      Fabric code for this Minecraft version (Platform, datagen, client)
// - ../common/src/            this Minecraft version's code for every loader (Compat, CompatBlock),
//                             its resources, and the generated data (written by this subproject's
//                             datagen, read by every loader)
// - root src/fabric/          Fabric code for every Minecraft version (entry points, tool mixins,
//                             Mod Menu)
// - root src/main/            code and resources for every Minecraft version and loader
// The first copy of a file wins (see duplicatesStrategy below), so generated data comes last and
// hand-made files override it.
// 26.3 rewrote worldgen (density functions moved to a compiled-sampler API, Feature became an
// interface, FeaturePlaceContext and TreeConfiguration removed). The shared files built on the old
// API are therefore replaced here rather than patched for every version: they are left out of the
// staged copy of root src/main/java and ../common/src/ supplies the 26.3 versions. A plain
// sourceSets exclude would also drop the 26.3 copies. Keep this list the same in the Fabric and
// NeoForge subprojects.
def sharedOverridden = [
	'io/arona74/aronalayers/gen/injection/FractionalSurfaceSampler.java',
	'io/arona74/aronalayers/gen/mixin/TreeSoilMixin.java',
]
def stagedSharedJava = layout.buildDirectory.dir('sharedJava')
def stageSharedJava = tasks.register('stageSharedJava', Sync) {
	from(rootProject.file('src/main/java')) {
		exclude sharedOverridden
	}
	into stagedSharedJava
}

sourceSets {
	main {
		java {
			srcDirs += [file('../common/src/main/java'), rootProject.file('src/fabric/java')]
			srcDir(stageSharedJava)
			// 26.3 has no AxeItem, HoeItem or ShovelItem: tool interactions are block transformers,
			// registered through Compat, so the tool mixins are left out.
			exclude 'io/arona74/aronalayers/mixin/tool/**'
		}
		resources {
			srcDirs = [file('src/main/resources'), file('../common/src/main/resources'), rootProject.file('src/fabric/resources'), rootProject.file('src/main/resources'), file('../common/src/main/generated')]
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		// Added above, after the hand-made resources, instead of first.
		addToResources = false
		outputDirectory = file('../common/src/main/generated')
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	// Nothing is remapped, so these are plain implementation dependencies.
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
	// Hand-made resources in src/main/resources take precedence over generated ones.
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	exclude 'aronalayers.tools.mixins.json'
	// NeoForge data maps, written by this datagen for the NeoForge jar.
	exclude 'data/neoforge/**'
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	// Declared as a toolchain, since other subprojects in the same build target Java 21.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	from([rootProject.file('LICENSE'), rootProject.file('LICENSE-MIT')]) {
		rename { "${it}_${rootProject.archives_base_name}" }
	}
	// Compile-only stand-ins for Mod Menu's API (see ModMenuApi): shipping them would shadow Mod Menu's own.
	exclude 'com/terraformersmc/**'
}

sourcesJar {
	exclude 'com/terraformersmc/**'
}
