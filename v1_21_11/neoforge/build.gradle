plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version "${moddev_version}"
	id 'maven-publish'
}

version = rootProject.mod_version + "+mc${minecraft_version}"
group = rootProject.maven_group

base {
	archivesName = rootProject.archives_base_name + '-neoforge'
}

// Sources, most specific first:
// - src/                      NeoForge code for this Minecraft version (Platform, client setup)
// - ../common/src/            this Minecraft version's code for every loader (Compat, CompatBlock),
//                             its resources, and the generated data (written by the Fabric
//                             subproject's datagen: data files are the same for every loader)
// - root src/neoforge/        NeoForge code for every Minecraft version (the @Mod entry point)
// - root src/main/            code and resources for every Minecraft version and loader
// The first copy of a file wins (see duplicatesStrategy below), so generated data comes last and
// hand-made files override it.
sourceSets {
	main {
		java {
			srcDirs += [file('../common/src/main/java'), rootProject.file('src/neoforge/java'), rootProject.file('src/main/java')]
		}
		resources {
			srcDirs = [file('src/main/resources'), file('../common/src/main/resources'), rootProject.file('src/neoforge/resources'), rootProject.file('src/main/resources'), file('../common/src/main/generated')]
			exclude '.cache/**'
		}
	}
}

neoForge {
	version = neoforge_version

	runs {
		client {
			client()
		}
		server {
			server()
		}
	}

	mods {
		aronalayers {
			sourceSet sourceSets.main
		}
	}
}

// Let the dedicated server read commands from the console, as Loom's runServer does.
tasks.named('runServer', JavaExec) {
	standardInput = System.in
}

processResources {
	inputs.property 'version', project.version
	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': project.version
	}
	// Hand-made resources take precedence over generated ones.
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${rootProject.archives_base_name}" }
	}
}
