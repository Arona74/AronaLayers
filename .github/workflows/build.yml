# Builds every Minecraft version and loader on each push and pull request, and uploads the jars.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # The 1.20.1 and 1.21.x subprojects build with Java 21 and the 26.x ones with Java 25.
      # The last version listed becomes JAVA_HOME, so Gradle itself runs on Java 25; each
      # version is also exported as JAVA_HOME_<version>_X64 for the toolchains below.
      - name: setup jdk 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            21
            25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      # Gradle doesn't look at setup-java's install folders on its own, so the JDKs are passed
      # in explicitly; without them, the Java 21 toolchains would not be found.
      - name: build
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            */*/build/libs/*.jar
            !*/*/build/libs/*-sources.jar
